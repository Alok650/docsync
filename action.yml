name: DocSync
description: Keeps your documentation in sync with your code — LLM-powered doc updates on every PR
author: Alok650

inputs:
  anthropic-api-key:
    description: Anthropic API key (required when using the anthropic provider)
    required: false
  openai-api-key:
    description: OpenAI API key (required when using the openai provider)
    required: false

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: node ${{ github.action_path }}/dist/cli.js check
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        GITHUB_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}

branding:
  icon: book-open
  color: blue
