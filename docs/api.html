<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Reference — docsync</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --purple: #bc8cff;
      --code-bg: #161b22;
      --radius: 8px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    nav {
      border-bottom: 1px solid var(--border);
      padding: 16px 0;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
    }
    nav .inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 24px;
    }
    nav .logo { font-size: 18px; font-weight: 700; color: var(--text); }
    nav .logo span { color: var(--accent); }
    nav .links { display: flex; gap: 24px; font-size: 14px; }
    nav .links a { color: var(--muted); }
    nav .links a:hover { color: var(--text); text-decoration: none; }

    .layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
      gap: 48px;
    }
    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { display: none; }
    }

    .sidebar {
      padding: 32px 0;
      position: sticky;
      top: 57px;
      height: calc(100vh - 57px);
      overflow-y: auto;
    }
    .sidebar h3 {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .sidebar ul { list-style: none; }
    .sidebar ul li { margin-bottom: 4px; }
    .sidebar ul li a {
      font-size: 13px;
      color: var(--muted);
      display: block;
      padding: 3px 8px;
      border-radius: 4px;
    }
    .sidebar ul li a:hover { color: var(--text); background: var(--surface); text-decoration: none; }

    .content {
      padding: 32px 0 80px;
      min-width: 0;
    }

    /* Markdown rendered styles */
    .content h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .content blockquote {
      color: var(--muted);
      font-size: 15px;
      margin: 0 0 32px;
      padding-left: 0;
      border: none;
    }
    .content h3 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin: 40px 0 16px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }
    .content h3 code {
      font-size: 12px;
      background: none;
      border: none;
      padding: 0;
      color: var(--muted);
      text-transform: none;
      letter-spacing: 0;
      font-weight: 600;
    }
    .content h4 {
      font-size: 16px;
      font-weight: 700;
      margin: 20px 0 4px;
      color: var(--text);
    }
    .content p { margin-bottom: 12px; font-size: 14px; color: var(--muted); line-height: 1.65; }
    .content p:last-child { margin-bottom: 0; }
    .content em { color: var(--purple); font-style: normal; font-size: 12px; font-weight: 500; }
    .content code {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
      font-family: 'SF Mono', 'Fira Mono', 'Consolas', monospace;
      font-size: 12px;
      color: var(--accent);
    }
    .content pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      overflow-x: auto;
      margin: 12px 0;
    }
    .content pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 13px;
      color: var(--text);
    }
    .content strong { color: var(--text); }

    #loading { text-align: center; padding: 80px 0; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>

<nav>
  <div class="inner">
    <a class="logo" href="../">doc<span>sync</span></a>
    <div class="links">
      <a href="https://github.com/Alok650/docsync">GitHub</a>
      <a href="../llms.txt">llms.txt</a>
    </div>
  </div>
</nav>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <h3>Modules</h3>
    <ul id="toc"></ul>
  </aside>

  <main class="content" id="content">
    <div id="loading">Loading API reference…</div>
  </main>
</div>

<script>
  async function load() {
    const res = await fetch('api.md')
    const md = await res.text()
    document.getElementById('content').innerHTML = marked.parse(md)
    buildToc()
  }

  function buildToc() {
    const toc = document.getElementById('toc')
    document.querySelectorAll('#content h3').forEach(h => {
      // Extract the file path from heading text
      const text = h.textContent.replace(/`/g, '').trim()
      const parts = text.split('/')
      const label = parts.slice(-2).join('/') // show last two path segments
      const li = document.createElement('li')
      const a = document.createElement('a')
      a.href = '#' + h.id
      a.textContent = label
      a.title = text
      li.appendChild(a)
      toc.appendChild(li)
    })
  }

  load()
</script>

</body>
</html>
